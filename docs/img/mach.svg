<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 900 470" role="img" aria-labelledby="t d"><title id="t">Why a supersonic thing drags a cone behind it</title><desc id="d">Circular sound wavefronts emitted one second apart by a source moving at Mach 1.5, their common tangent forming a cone of half-angle 41.8 degrees.</desc><style>.ink{fill:#17120e} .mut{fill:#6a5c48} .acc{fill:#b7222a}.s{stroke:#17120e;fill:none;stroke-width:2}.sm{stroke:#d8c9ae;fill:none;stroke-width:1.4}.sa{stroke:#b7222a;fill:none;stroke-width:3}.sb{stroke:#e08a1e;fill:none;stroke-width:2.4}text{font-family:Georgia,serif;font-size:15px}.lab{font-family:"Bebas Neue",Oswald,"Arial Narrow",sans-serif;letter-spacing:.06em;font-size:17px}.holler{font-family:"Bebas Neue",Oswald,"Arial Narrow",sans-serif;font-size:26px;letter-spacing:.04em;fill:#e08a1e;transform-box:fill-box;transform-origin:center}.pop{animation:pop 4s ease-in-out infinite;opacity:0}@keyframes pop{0%,58%{opacity:0;transform:translateY(10px) scale(.85) rotate(-7deg)}66%{opacity:1;transform:translateY(0) scale(1.12) rotate(-7deg)}72%{transform:translateY(0) scale(1) rotate(-7deg)}90%{opacity:1}100%{opacity:0;transform:translateY(-8px) scale(1) rotate(-7deg)}}.rider{animation:rider 7s linear infinite}@keyframes rider{0%{opacity:0}4%{opacity:1}96%{opacity:1}100%{opacity:0}}.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.6s ease-out both}@keyframes draw{to{stroke-dashoffset:0}}.slide{animation:slide .8s cubic-bezier(.2,.9,.3,1) both}@keyframes slide{0%{opacity:0;transform:translateX(-26px)}100%{opacity:1;transform:translateX(0)}}.throb{animation:throb 2.6s ease-in-out infinite}@keyframes throb{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}.pop,.rider{opacity:1}}@media (prefers-color-scheme:dark){.ink{fill:#f0e6d6} .mut{fill:#a6947c} .acc{fill:#ef4b4b}.s{stroke:#f0e6d6} .sm{stroke:#3a3128} .sa{stroke:#ef4b4b}.sb{stroke:#f0b04a} .holler{fill:#f0b04a}}</style><circle cx="758.0" cy="235" r="28.0" class="sm throb" style="animation-delay:-0.36s"/><circle cx="716.0" cy="235" r="56.0" class="sm throb" style="animation-delay:-0.72s"/><circle cx="674.0" cy="235" r="84.0" class="sm throb" style="animation-delay:-1.08s"/><circle cx="632.0" cy="235" r="112.0" class="sm throb" style="animation-delay:-1.44s"/><circle cx="590.0" cy="235" r="140.0" class="sm throb" style="animation-delay:-1.80s"/><circle cx="548.0" cy="235" r="168.0" class="sm throb" style="animation-delay:-2.16s"/><line x1="800" y1="235" x2="550" y2="11.4" class="sa"/><line x1="800" y1="235" x2="550" y2="458.6" class="sa"/><line x1="60" y1="235" x2="800" y2="235" class="sm"/><polygon points="800,235 774,227 774,243" class="acc"/><text x="800" y="63" text-anchor="end" class="lab ink">GOIN' MACH 1.5 — HALF AGAIN THE SPEED OF SOUND</text><text x="544" y="462.6" text-anchor="end" class="acc lab">THE BOOM RIDES THIS EDGE</text><text x="34" y="34" class="mut">each ring is the racket it made one second earlier, spreadin' out at 343 m/s in all directions</text><text x="800" y="327" text-anchor="end" class="holler pop">YEE HAW!</text><text x="34" y="448" class="ink">sin μ = 1 / M &#160;→&#160; μ = 41.8° at Mach 1.5</text></svg>