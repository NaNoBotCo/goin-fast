<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 628" role="img" aria-labelledby="t d"><title id="t">The ladder of speed, on a log scale</title><desc id="d">Twenty measured speeds from continental drift to light, one row each, plotted on a shared base-ten logarithmic axis of metres per second.</desc><style>.ink{fill:#17120e} .mut{fill:#6a5c48} .acc{fill:#b7222a}.s{stroke:#17120e;fill:none;stroke-width:2}.sm{stroke:#d8c9ae;fill:none;stroke-width:1.4}.sa{stroke:#b7222a;fill:none;stroke-width:3}.sb{stroke:#e08a1e;fill:none;stroke-width:2.4}text{font-family:Georgia,serif;font-size:15px}.lab{font-family:"Bebas Neue",Oswald,"Arial Narrow",sans-serif;letter-spacing:.06em;font-size:17px}.holler{font-family:"Bebas Neue",Oswald,"Arial Narrow",sans-serif;font-size:26px;letter-spacing:.04em;fill:#e08a1e;transform-box:fill-box;transform-origin:center}.pop{animation:pop 4s ease-in-out infinite;opacity:0}@keyframes pop{0%,58%{opacity:0;transform:translateY(10px) scale(.85) rotate(-7deg)}66%{opacity:1;transform:translateY(0) scale(1.12) rotate(-7deg)}72%{transform:translateY(0) scale(1) rotate(-7deg)}90%{opacity:1}100%{opacity:0;transform:translateY(-8px) scale(1) rotate(-7deg)}}.rider{animation:rider 7s linear infinite}@keyframes rider{0%{opacity:0}4%{opacity:1}96%{opacity:1}100%{opacity:0}}.draw{stroke-dasharray:2400;stroke-dashoffset:2400;animation:draw 2.6s ease-out both}@keyframes draw{to{stroke-dashoffset:0}}.slide{animation:slide .8s cubic-bezier(.2,.9,.3,1) both}@keyframes slide{0%{opacity:0;transform:translateX(-26px)}100%{opacity:1;transform:translateX(0)}}.throb{animation:throb 2.6s ease-in-out infinite}@keyframes throb{0%,100%{opacity:.35}50%{opacity:1}}@media (prefers-reduced-motion:reduce){*{animation:none!important;stroke-dashoffset:0!important}.pop,.rider{opacity:1}}@media (prefers-color-scheme:dark){.ink{fill:#f0e6d6} .mut{fill:#a6947c} .acc{fill:#ef4b4b}.s{stroke:#f0e6d6} .sm{stroke:#3a3128} .sa{stroke:#ef4b4b}.sb{stroke:#f0b04a} .holler{fill:#f0b04a}}</style><line x1="278.0" y1="38" x2="278.0" y2="582" class="sm"/><text x="278.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">-9</tspan></text><line x1="368.0" y1="38" x2="368.0" y2="582" class="sm"/><text x="368.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">-6</tspan></text><line x1="458.0" y1="38" x2="458.0" y2="582" class="sm"/><text x="458.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">-3</tspan></text><line x1="548.0" y1="38" x2="548.0" y2="582" class="sm"/><text x="548.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">0</tspan></text><line x1="638.0" y1="38" x2="638.0" y2="582" class="sm"/><text x="638.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">3</tspan></text><line x1="728.0" y1="38" x2="728.0" y2="582" class="sm"/><text x="728.0" y="600" text-anchor="middle" class="mut">10<tspan dy="-6" font-size="10">6</tspan></text><text x="260" y="28" class="lab ink">METRES PER SECOND — EACH GRID LINE IS A THOUSAND TIMES THE LAST</text><rect x="0" y="44" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="59" text-anchor="end" class="ink">The ground under the house</text><line x1="260.0" y1="54" x2="274.9" y2="54" class="sm slide" style="animation-delay:0.00s"/><circle cx="274.9" cy="54" r="5" class="acc slide" style="animation-delay:0.00s"/><text x="285.9" y="59" class="mut slide" style="animation-delay:0.00s">7.9e-10 m/s</text><text x="246" y="85" text-anchor="end" class="ink">A racin' snail</text><line x1="260.0" y1="80" x2="471.2" y2="80" class="sm slide" style="animation-delay:0.09s"/><circle cx="471.2" cy="80" r="5" class="acc slide" style="animation-delay:0.09s"/><text x="482.2" y="85" class="mut slide" style="animation-delay:0.09s">2.8 mm/s</text><rect x="0" y="96" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="111" text-anchor="end" class="ink">A body walkin'</text><line x1="260.0" y1="106" x2="550.4" y2="106" class="sm slide" style="animation-delay:0.18s"/><circle cx="550.4" cy="106" r="5" class="acc slide" style="animation-delay:0.18s"/><text x="561.4" y="111" class="mut slide" style="animation-delay:0.18s">1.2 m/s</text><text x="246" y="137" text-anchor="end" class="ink">Usain Bolt, flat out</text><line x1="260.0" y1="132" x2="580.7" y2="132" class="sm slide" style="animation-delay:0.27s"/><circle cx="580.7" cy="132" r="5" class="acc slide" style="animation-delay:0.27s"/><text x="591.7" y="137" class="mut slide" style="animation-delay:0.27s">12 m/s</text><rect x="0" y="148" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="163" text-anchor="end" class="ink">A cheetah, hunting</text><line x1="260.0" y1="158" x2="590.4" y2="158" class="sm slide" style="animation-delay:0.36s"/><circle cx="590.4" cy="158" r="5" class="acc slide" style="animation-delay:0.36s"/><text x="601.4" y="163" class="mut slide" style="animation-delay:0.36s">26 m/s</text><text x="246" y="189" text-anchor="end" class="ink">Pickup on the interstate</text><line x1="260.0" y1="184" x2="592.9" y2="184" class="sm slide" style="animation-delay:0.45s"/><circle cx="592.9" cy="184" r="5" class="acc slide" style="animation-delay:0.45s"/><text x="603.9" y="189" class="mut slide" style="animation-delay:0.45s">31 m/s</text><rect x="0" y="200" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="215" text-anchor="end" class="ink">A peregrine, stooping</text><line x1="260.0" y1="210" x2="609.0" y2="210" class="sm slide" style="animation-delay:0.54s"/><circle cx="609.0" cy="210" r="5" class="acc slide" style="animation-delay:0.54s"/><text x="620.0" y="215" class="mut slide" style="animation-delay:0.54s">108 m/s</text><text x="246" y="241" text-anchor="end" class="ink">ThrustSSC, on the salt</text><line x1="260.0" y1="236" x2="624.0" y2="236" class="sm slide" style="animation-delay:0.63s"/><circle cx="624.0" cy="236" r="5" class="acc slide" style="animation-delay:0.63s"/><text x="635.0" y="241" class="mut slide" style="animation-delay:0.63s">341 m/s</text><rect x="0" y="252" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="267" text-anchor="end" class="ink">Sound, in the air out front</text><line x1="260.0" y1="262" x2="624.1" y2="262" class="sm slide" style="animation-delay:0.72s"/><circle cx="624.1" cy="262" r="5" class="acc slide" style="animation-delay:0.72s"/><text x="635.1" y="267" class="mut slide" style="animation-delay:0.72s">343 m/s</text><text x="246" y="293" text-anchor="end" class="ink">The tip of a bullwhip</text><line x1="260.0" y1="288" x2="633.1" y2="288" class="sm slide" style="animation-delay:0.81s"/><circle cx="633.1" cy="288" r="5" class="acc slide" style="animation-delay:0.81s"/><text x="644.1" y="293" class="mut slide" style="animation-delay:0.81s">686 m/s</text><rect x="0" y="304" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="319" text-anchor="end" class="ink">A .30-06, leavin' the muzzle</text><line x1="260.0" y1="314" x2="635.9" y2="314" class="sm slide" style="animation-delay:0.90s"/><circle cx="635.9" cy="314" r="5" class="acc slide" style="animation-delay:0.90s"/><text x="646.9" y="319" class="mut slide" style="animation-delay:0.90s">853 m/s</text><text x="246" y="345" text-anchor="end" class="ink">An SR-71, in a straight line</text><line x1="260.0" y1="340" x2="637.7" y2="340" class="sm slide" style="animation-delay:0.99s"/><circle cx="637.7" cy="340" r="5" class="acc slide" style="animation-delay:0.99s"/><text x="648.7" y="345" class="mut slide" style="animation-delay:0.99s">980 m/s</text><rect x="0" y="356" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="371" text-anchor="end" class="ink">The X-15, with the rocket lit</text><line x1="260.0" y1="366" x2="647.2" y2="366" class="sm slide" style="animation-delay:1.08s"/><circle cx="647.2" cy="366" r="5" class="acc slide" style="animation-delay:1.08s"/><text x="658.2" y="371" class="mut slide" style="animation-delay:1.08s">2.0 km/s</text><text x="246" y="397" text-anchor="end" class="ink">The space station, goin' around</text><line x1="260.0" y1="392" x2="664.5" y2="392" class="sm slide" style="animation-delay:1.17s"/><circle cx="664.5" cy="392" r="5" class="acc slide" style="animation-delay:1.17s"/><text x="675.5" y="397" class="mut slide" style="animation-delay:1.17s">7.7 km/s</text><rect x="0" y="408" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="423" text-anchor="end" class="ink">Quittin' the Earth entirely</text><line x1="260.0" y1="418" x2="669.5" y2="418" class="sm slide" style="animation-delay:1.26s"/><circle cx="669.5" cy="418" r="5" class="acc slide" style="animation-delay:1.26s"/><text x="680.5" y="423" class="mut slide" style="animation-delay:1.26s">11.2 km/s</text><text x="246" y="449" text-anchor="end" class="ink">Voyager 1, still leavin'</text><line x1="260.0" y1="444" x2="674.9" y2="444" class="sm slide" style="animation-delay:1.35s"/><circle cx="674.9" cy="444" r="5" class="acc slide" style="animation-delay:1.35s"/><text x="685.9" y="449" class="mut slide" style="animation-delay:1.35s">17.0 km/s</text><rect x="0" y="460" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="475" text-anchor="end" class="ink">This whole planet, orbitin'</text><line x1="260.0" y1="470" x2="682.2" y2="470" class="sm slide" style="animation-delay:1.44s"/><circle cx="682.2" cy="470" r="5" class="acc slide" style="animation-delay:1.44s"/><text x="693.2" y="475" class="mut slide" style="animation-delay:1.44s">29.8 km/s</text><text x="246" y="501" text-anchor="end" class="ink">The Parker Solar Probe, at the bottom</text><line x1="260.0" y1="496" x2="706.5" y2="496" class="sm slide" style="animation-delay:1.53s"/><circle cx="706.5" cy="496" r="5" class="acc slide" style="animation-delay:1.53s"/><text x="717.5" y="501" class="mut slide" style="animation-delay:1.53s">192 km/s</text><rect x="0" y="512" width="980" height="26" fill="#b7222a" opacity=".045"/><text x="246" y="527" text-anchor="end" class="ink">The Sun, haulin' the lot of us</text><line x1="260.0" y1="522" x2="708.9" y2="522" class="sm slide" style="animation-delay:1.62s"/><circle cx="708.9" cy="522" r="5" class="acc slide" style="animation-delay:1.62s"/><text x="719.9" y="527" class="mut slide" style="animation-delay:1.62s">230 km/s</text><text x="246" y="553" text-anchor="end" class="ink">Light</text><line x1="260.0" y1="548" x2="802.3" y2="548" class="sm slide" style="animation-delay:1.71s"/><circle cx="802.3" cy="548" r="5" class="acc slide" style="animation-delay:1.71s"/><text x="813.3" y="553" class="mut slide" style="animation-delay:1.71s">299,792 km/s</text><text x="786.3" y="534" text-anchor="end" class="holler pop">YEE HAW!</text></svg>